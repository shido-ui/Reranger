name: Reranger Release Candidate & Automated APK Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release_apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 (Zulu Distribution)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter SDK (3.47.7)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: 4. Resolve Flutter Dependencies
        run: flutter pub get

      - name: 5. Execute Full Quality Pipeline & Test Suite (271 Tests)
        run: bash scripts/verify.sh

      - name: 6. Compile Android Release APK (Split Per ABI)
        run: flutter build apk --release --split-per-abi

      - name: 7. Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reranger-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
